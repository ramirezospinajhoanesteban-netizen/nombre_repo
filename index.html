<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
<div class="container mt-5">
    <form id="formulario" novalidate>

        <!-- MENSAJE GENERAL -->
        <div id="mensajeGeneral"></div>

        <!-- Usuario -->
        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" class="form-control" id="usuario">
            <div class="invalid-feedback">
                Mínimo 3 caracteres. Solo letras, números, puntos (.), guiones (-) y guion bajo (_).
            </div>
            <div class="valid-feedback">
                Usuario válido ✅
            </div>
        </div>

        <!-- Correo -->
        <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="text" class="form-control" id="correo">
            <div class="invalid-feedback">
                Correo electrónico inválido.
            </div>
            <div class="valid-feedback">
                Correo válido ✅
            </div>
        </div>

        <!-- Contraseña -->
        <div class="mb-3">
            <label class="form-label">Contraseña</label>

            <div class="input-group">
                <input type="password" class="form-control" id="password">
                <button type="button" class="btn btn-outline-secondary" id="togglePassword">
                    👁
                </button>
            </div>

            <small id="contador" class="text-muted">0 caracteres</small>

            <div class="invalid-feedback">
                Mínimo 10 caracteres, incluir número y carácter especial.
            </div>
            <div class="valid-feedback">
                Contraseña fuerte ✅
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100" id="btnEnviar">
            Iniciar sesión
        </button>

    </form>
</div>






 <script src="validacion.js"></script>
